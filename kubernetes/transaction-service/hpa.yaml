# ${NAMESPACE} substituted by scripts/deploy-app.sh via envsubst.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: microservice1
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
