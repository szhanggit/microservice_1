# No serviceAccountName set - TransactionGateway never calls an AWS API
# directly (Terraform.md §7's "TransactionGateway gets no IRSA role" note),
# so it runs under the namespace's default ServiceAccount.
#
# replicas: 2 + hpa.yaml + pdb.yaml, matching microservice_0/kubernetes's
# convention for its own internet-facing gateway (Kubernetes.md §2).
#
# ${NAMESPACE}/${GATEWAY_IMAGE}/${GW_REDIS_ENDPOINT} are substituted by
# scripts/deploy-app.sh via envsubst - not valid YAML to kubectl apply
# directly, see that script.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-gateway
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: transaction-gateway
    app.kubernetes.io/part-of: microservice1
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-gateway
        app.kubernetes.io/part-of: microservice1
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: transaction-gateway
          image: ${GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Redis__ConnectionString
              value: "${GW_REDIS_ENDPOINT}:6379"
            # In-cluster Service DNS name, not localhost/host.docker.internal -
            # gRPC over plain HTTP/2 ("h2c"), same as the docker-compose setup
            # (TransactionGateway.Api/Program.cs already opts into
            # Http2UnencryptedSupport for this).
            - name: TransactionService__GrpcAddress
              value: "http://transaction-service:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
