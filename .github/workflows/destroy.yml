name: Destroy

# Manual-only, deliberately - never triggered by a push. Requires typing the
# environment name again as `confirm`, a common safety pattern for
# destructive workflows. Shares its concurrency group name with deploy.yml so
# a deploy and a destroy of the same environment can never race each other.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options: [develop, staging, production]
        default: develop
      confirm:
        description: Type the environment name above to confirm
        type: string
        required: true

concurrency:
  group: microservice1-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm environment name matches
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::confirm ('${{ inputs.confirm }}') does not match environment ('${{ inputs.environment }}') - aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: extractions/setup-just@v2
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Update kubeconfig
        working-directory: helm
        run: just update-kubeconfig "${{ inputs.environment }}"

      - name: Destroy app
        working-directory: helm
        run: just destroy-app "${{ inputs.environment }}"
