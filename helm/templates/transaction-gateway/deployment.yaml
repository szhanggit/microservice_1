# No serviceAccountName set - TransactionGateway never calls an AWS API
# directly (Terraform.md §7's "TransactionGateway gets no IRSA role" note),
# so it runs under the namespace's default ServiceAccount. Matches
# kubernetes/transaction-gateway/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: transaction-gateway
    app.kubernetes.io/part-of: microservice1
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-gateway
        app.kubernetes.io/part-of: microservice1
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: transaction-gateway
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Redis__ConnectionString
              value: "{{ .Values.gateway.redis.endpoint }}:6379"
            # In-cluster Service DNS name, not localhost/host.docker.internal -
            # gRPC over plain HTTP/2 ("h2c"), same as the docker-compose setup
            # (TransactionGateway.Api/Program.cs already opts into
            # Http2UnencryptedSupport for this).
            - name: TransactionService__GrpcAddress
              value: "http://transaction-service:8080"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
