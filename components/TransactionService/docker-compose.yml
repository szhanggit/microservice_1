# TransactionService.md §7: local Redis container for convenient iteration.
# AWS credentials come from the host environment (profile/SSO) so this sends
# to the real dev TransactionQueue, per §2 - no local SQS emulator.
services:
  transaction-service:
    build:
      context: ..
      dockerfile: TransactionService/Dockerfile
    ports:
      - "8081:8080"  # gRPC
      - "8082:8081"  # health probes
    environment:
      Redis__ConnectionString: redis-service:6379
      Sqs__QueueUrl: ${SQS_QUEUE_URL:?set SQS_QUEUE_URL to the real dev TransactionQueue URL}
      AWS__Region: ${AWS_REGION:-ca-central-1}
      # Passed through from the host shell (e.g. `eval $(aws configure export-credentials
      # --format env)` for an SSO profile) rather than mounting ~/.aws, since the
      # container's home directory/user isn't guaranteed to match the host's.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Search read path (TransactionService.md §5/§7) - read-only role,
      # distinct from TransactionWorker's write-capable credentials.
      Shards__ConnectionStrings__0: ${SHARD_0_READONLY_CONNECTION_STRING:?set SHARD_0_READONLY_CONNECTION_STRING to the dev shard-0 RDS instance}
      Shards__ConnectionStrings__1: ${SHARD_1_READONLY_CONNECTION_STRING:?set SHARD_1_READONLY_CONNECTION_STRING to the dev shard-1 RDS instance}
      Shards__ConnectionStrings__2: ${SHARD_2_READONLY_CONNECTION_STRING:?set SHARD_2_READONLY_CONNECTION_STRING to the dev shard-2 RDS instance}
      Reporting__ConnectionString: ${REPORTING_READONLY_CONNECTION_STRING:?set REPORTING_READONLY_CONNECTION_STRING to the dev reporting RDS instance}
    depends_on:
      - redis-service

  redis-service:
    image: redis:7-alpine
    ports:
      - "6380:6379"
